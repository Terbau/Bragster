[project]
name = "padel-analyzer"
version = "1.0.0"
description = "Finds the rallies in padel match videos recorded with the Bragster app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=14",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "azure-storage-blob>=12.23",
    "azure-storage-queue>=12.12",
]

[tool.uv]
package = false
dev-dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
